name: Release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build and Release
        uses: cfindlayisme/golang-cli-builder@v1
        with:
          go-version: '1.25.0'
          binary-name: 'pgtui'
          build-targets: 'linux/amd64 linux/arm64 darwin/amd64 darwin/arm64'
          github-token: ${{ secrets.GITHUB_TOKEN }}

          enable-brew: 'true'
          brew-targets: 'darwin/amd64 darwin/arm64'
          brew-tap-repo: 'cfindlayisme/homebrew-tap'
          brew-tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          package-description: 'A small terminal UI for browsing and querying Postgres.'
